[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/persistence",
    "crates/http-public",
    "crates/temporal-client",
    "bin/api",
    "bin/genhash",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"

[workspace.dependencies]
# 內部
domain = { path = "crates/domain" }
persistence = { path = "crates/persistence" }
http-public = { path = "crates/http-public" }
temporal-client = { path = "crates/temporal-client" }

# Web
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id"] }

# 非同步
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# 資料庫
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate",
] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gRPC（Temporal）
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# 認證
jsonwebtoken = "9"
argon2 = "0.5"

# 工具
# v5 用於從 workflow_id 推導穩定的 request_id，使重送請求可去重
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jsonschema = "0.26"
